name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk build-essential libffi-dev libssl-dev libsqlite3-dev
        pip install --upgrade "cython<3.0.0" "buildozer==1.5.0"

    - name: Build with Buildozer
      run: |
        yes | buildozer -v android debug --warn_on_root=0

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: rawmaterialapp-apk
        path: bin/*.apk
